</style></head><body><main><header><div><div class="eyebrow">GPT VIDEOS / 004 / A SPRING DRIFT</div><h1>樱落，向北</h1><p>秒速五厘米的春日旅行 · 八处风景，由南向北。</p></div><p class="meta">96 秒 · 1920 × 1080 · 24 fps<br>日漫绘景 / 分层飘花 / 原创配乐</p></header><video id="player" controls playsinline preload="metadata" poster="output/poster.png"><source src="output/sakura-latitudes-96s.mp4" type="video/mp4"></video><nav id="chapters"></nav><footer><div>顺序依据景点约略纬度：30.25°N → 49.24°N。<br>取景依据网上实景参考，以 AI 绘景和程序动画重新呈现。</div><div><a href="output/sakura-latitudes-96s.mp4" download>下载 MP4</a> · <a href="references.html">逐站图片与视频参考</a> · <a href="index.html">实时动画</a></div></footer></main><script type="module">import{SCENES}from'./scenes.js';const v=document.getElementById('player'),nav=document.getElementById('chapters');SCENES.forEach((s,i)=>{const b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0')+' '+s.city+' · '+s.name;const small=document.createElement('small');small.textContent=String(Math.floor(i*12/60)).padStart(2,'0')+':'+String(i*12%60).padStart(2,'0')+' / '+s.lat.toFixed(2)+'°N';b.append(small);b.onclick=()=>{v.currentTime=i*12+.3;v.play()};nav.append(b)});v.ontimeupdate=()=>[...nav.children].forEach((b,i)=>b.classList.toggle('active',i===Math.min(7,Math.floor(v.currentTime/12))));</script></body></html>
