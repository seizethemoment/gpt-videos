<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEGRONI · 三味等份，一杯经典</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e9e3d8;color:#33302c}
    body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:22px;font-family:"PingFang SC",system-ui,sans-serif}
    canvas{display:block;width:min(86vh,100%,760px);height:auto;box-shadow:0 12px 50px #382d251c;border-radius:3px}
    .controls{display:flex;align-items:center;gap:16px;width:min(86vh,100%,760px);padding:18px 2px 0;font-size:12px}
    button{border:1px solid #c9bcb0;border-radius:24px;background:#f8f3e9;padding:9px 18px;color:#763739;cursor:pointer;font:inherit;white-space:nowrap}
    input{flex:1;accent-color:#c84c52;min-width:40px}span{font-variant-numeric:tabular-nums;white-space:nowrap}
    body.render{padding:0;background:transparent;display:block;min-height:0}body.render canvas{width:1080px;height:1080px;box-shadow:none;border-radius:0}body.render .controls{display:none}
  </style>
</head>
<body>
  <canvas id="film" width="1080" height="1080" aria-label="尼格罗尼调酒步骤动画"></canvas>
  <div class="controls">
    <button id="play">播放 · 开启声音</button>
    <input id="seek" type="range" min="0" max="30" step="0.01" value="0" aria-label="播放进度">
    <span id="time">00:00 / 00:30</span>
    <button id="restart">重播</button>
  </div>
  <audio id="music" src="output/soundtrack.wav" preload="metadata"></audio>
  <script src="animation.js"></script>
</body>
</html>
