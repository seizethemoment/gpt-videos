<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>光，如何成为照片 · 摄影原理</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-content:center;background:#060d12;color:#b0c4c9;font:13px "PingFang SC",sans-serif;padding:20px}main{width:min(96vw,1400px)}canvas{display:block;width:100%;height:auto;border-radius:6px;box-shadow:0 18px 90px #0008}.controls{display:flex;align-items:center;gap:16px;margin:18px 2px}button{font:inherit;border:1px solid #34464f;background:#101e27;color:#f4c48c;border-radius:25px;padding:9px 18px;cursor:pointer;white-space:nowrap}input{flex:1;accent-color:#edbc81;min-width:40px}span{font-variant-numeric:tabular-nums;white-space:nowrap}body.render{padding:0;display:block;min-height:0}body.render main{width:1920px}body.render canvas{width:1920px;height:1080px;border-radius:0;box-shadow:none}body.render .controls{display:none}</style>
<main><canvas id="film" width="1920" height="1080" aria-label="摄影物理原理动画"></canvas><div class="controls"><button id="play">播放 · 开启声音</button><input id="seek" type="range" min="0" max="90" step="0.01" value="0" aria-label="播放进度"><span id="time">00:00 / 01:30</span><button id="restart">重播</button></div></main>
<audio id="music" src="output/soundtrack.m4a" preload="metadata"></audio>
<script src="narration-data.js"></script><script src="animation.js"></script>
</html>
